{% extends "base.html" %}

{% block title %}登录 · 牛脸识别系统{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-card">
    <h1 class="h4 text-center mb-4">登录</h1>
    <form method="POST" action="{{ url_for('web.auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <label class="form-label" for="username">用户名</label>
            <input class="form-control" id="username" type="text" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">密码</label>
            <input class="form-control" id="password" type="password" name="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">登录</button>
    </form>
    <p class="text-center text-muted mt-4 mb-0">
        还没有账号？<a href="{{ url_for('web.auth.register') }}">立即注册</a>
    </p>
</div>
{% endblock %}
