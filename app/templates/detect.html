{% extends "base.html" %}

{% block title %}牛脸检测 · 牛脸识别系统{% endblock %}

{% block content %}
<div class="container mt-4" id="detect-page" data-endpoint="{{ url_for('api.detect.run_detection') }}">
    <h1 class="h3 mb-4">牛脸检测</h1>

    <div class="card mb-4">
        <div class="card-body">
            <p class="text-muted small mb-3">检测模型 YOLOv8 · 识别模型 EfficientNet-B0</p>
            <div class="row g-2 align-items-end">
                <div class="col-md-8">
                    <label class="form-label" for="image-input">选择图片</label>
                    <input class="form-control" id="image-input" type="file" accept=".jpg,.jpeg,.png,.bmp,.webp">
                </div>
                <div class="col-md-4 d-grid">
                    <button class="btn btn-primary" id="detect-button" type="button">开始检测</button>
                </div>
            </div>
            <div class="alert alert-danger d-none mt-3 mb-0" id="detect-error" role="alert"></div>
        </div>
    </div>

    <div class="text-center text-muted d-none" id="detect-loading">
        <div class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></div>正在识别…
    </div>

    <div class="card d-none" id="detect-result">
        <div class="card-body">
            <img alt="检测结果" class="detect-preview mb-3" id="detect-preview">
            <h2 class="h6">检测结果</h2>
            <ol class="list-group list-group-numbered" id="detect-list"></ol>
            <p class="text-muted small mt-3 mb-0 d-none" id="detect-saved"></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/detect.js') }}"></script>
{% endblock %}
