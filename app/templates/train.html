{% extends "base.html" %}

{% block title %}模型训练 · 牛脸识别系统{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="h3 mb-4">模型训练</h1>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card">
                <div class="card-body">
                    <form id="train-form"
                          data-endpoint="{{ url_for('api.train.start_training') }}"
                          data-next="{{ url_for('web.train.training_status_page') }}">
                        <div class="mb-3">
                            <label class="form-label" for="epochs">训练轮数</label>
                            <input class="form-control" id="epochs" type="number" name="epochs" value="50" min="1" max="1000" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="batch-size">批次大小</label>
                            <input class="form-control" id="batch-size" type="number" name="batch_size" value="16" min="1" max="128" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="learning-rate">学习率</label>
                            <input class="form-control" id="learning-rate" type="number" name="learning_rate" value="0.001"
                                   step="0.0001" min="0.00001" max="1" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="model-type">模型类型</label>
                            <select class="form-select" id="model-type" name="model_type">
                                {% for value, label in model_types %}
                                <option value="{{ value }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="alert alert-danger d-none" id="train-error" role="alert"></div>
                        <button class="btn btn-primary w-100" type="submit">开始训练</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h6 card-title">说明</h2>
                    <ul class="text-muted small mb-0 ps-3">
                        <li>训练在后台线程执行，可以离开页面。</li>
                        <li>进度与指标在<a href="{{ url_for('web.train.training_status_page') }}">训练状态</a>页刷新。</li>
                        <li>服务重启会中断正在跑的训练。</li>
                        <li>训练产物落在 <code>runs/train/</code>。</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/train.js') }}"></script>
{% endblock %}
