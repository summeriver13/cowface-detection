{% extends "base.html" %}

{% block title %}首页 · 牛脸识别系统{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <div>
            <h1 class="h3 mb-1">欢迎，{{ user.username }}</h1>
            <p class="text-muted mb-0">YOLOv8 定位牛脸，EfficientNet 判断个体</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-primary" href="{{ url_for('web.detect.detect_page') }}">开始检测</a>
            <a class="btn btn-outline-secondary" href="{{ url_for('web.cattle.cattle_list') }}">管理牛只</a>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-3">
        <div class="col">
            <div class="card h-100 stat-card">
                <div class="card-body">
                    <p class="text-muted mb-1">牛只</p>
                    <p class="display-6 mb-0">{{ stats.cattle }}</p>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card h-100 stat-card">
                <div class="card-body">
                    <p class="text-muted mb-1">识别记录</p>
                    <p class="display-6 mb-0">{{ stats.records }}</p>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card h-100 stat-card">
                <div class="card-body">
                    <p class="text-muted mb-1">训练任务</p>
                    <p class="display-6 mb-0">{{ stats.trainings }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
