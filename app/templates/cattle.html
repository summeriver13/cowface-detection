{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>牛只管理</h2>
    
    <!-- 添加牛只表单 -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">添加新牛只</h5>
            <form id="addCattleForm" class="row g-3">
                <div class="col-md-6">
                    <input type="text" class="form-control" id="cattleName" name="name" placeholder="输入牛只名称" required>
                </div>
                <div class="col-md-6">
                    <button type="submit" class="btn btn-primary">添加</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 牛只列表 -->
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">牛只列表</h5>
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>名称</th>
                            <th>最近识别记录</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for cow in cattle %}
                        <tr>
                            <td>{{ cow.cattle_id }}</td>
                            <td>
                                <span class="cattle-name">{{ cow.name }}</span>
                                <input type="text" class="form-control edit-name" style="display: none;" value="{{ cow.name }}">
                            </td>
                            <td>
                                {% if cow.recent_records %}
                                <small>最近{{ cow.recent_records|length }}条记录</small>
                                {% else %}
                                <small class="text-muted">暂无记录</small>
                                {% endif %}
                            </td>
                            <td>
                                <div class="btn-group">
                                    <button class="btn btn-sm btn-outline-primary view-btn" data-id="{{ cow.cattle_id }}">
                                        查看详情
                                    </button>
                                    <button class="btn btn-sm btn-outline-secondary edit-btn" data-id="{{ cow.cattle_id }}">
                                        编辑
                                    </button>
                                    <button class="btn btn-sm btn-outline-success save-btn" style="display: none;" data-id="{{ cow.cattle_id }}">
                                        保存
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger delete-btn" data-id="{{ cow.cattle_id }}">
                                        删除
                                    </button>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    // 添加牛只
    $('#addCattleForm').on('submit', function(e) {
        e.preventDefault();
        $.ajax({
            url: '/cattle/add',
            method: 'POST',
            data: $(this).serialize(),
            success: function(response) {
                if (response.status === 'success') {
                    location.reload();
                } else {
                    alert(response.message);
                }
            }
        });
    });

    // 编辑按钮点击
    $('.edit-btn').on('click', function() {
        var row = $(this).closest('tr');
        row.find('.cattle-name').hide();
        row.find('.edit-name').show();
        $(this).hide();
        row.find('.save-btn').show();
    });

    // 保存按钮点击
    $('.save-btn').on('click', function() {
        var row = $(this).closest('tr');
        var id = $(this).data('id');
        var name = row.find('.edit-name').val();

        $.ajax({
            url: '/cattle/edit/' + id,
            method: 'POST',
            data: { name: name },
            success: function(response) {
                if (response.status === 'success') {
                    location.reload();
                } else {
                    alert(response.message);
                }
            }
        });
    });

    // 删除按钮点击
    $('.delete-btn').on('click', function() {
        if (!confirm('确定要删除这个牛只吗？相关的识别记录也会被删除。')) {
            return;
        }

        var id = $(this).data('id');
        $.ajax({
            url: '/cattle/delete/' + id,
            method: 'POST',
            success: function(response) {
                if (response.status === 'success') {
                    location.reload();
                } else {
                    alert(response.message);
                }
            }
        });
    });

    // 查看详情按钮点击
    $('.view-btn').on('click', function() {
        var id = $(this).data('id');
        window.location.href = '/cattle/detail/' + id;
    });
});
</script>
{% endblock %}
