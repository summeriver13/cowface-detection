name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - name: 只装 Web 依赖，ML 栈是惰性导入
        run: uv pip install ruff -r requirements-web.txt
      - run: uv run ruff check app scripts
      - name: app 导入不许拉起 torch
        run: uv run python -c "import sys, app; assert 'torch' not in sys.modules, 'app 把 torch 拉起来了'; print('lazy imports ok')"
      - run: uv run python scripts/smoke_test.py
